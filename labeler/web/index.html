<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peat labels</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
    />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      .box {
        position: absolute;
        left: 10px;
        z-index: 1;
        background: #fff;
        color: #222;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      #panel {
        top: 10px;
        width: min(320px, calc(100% - 70px));
        padding: 8px;
      }
      #search {
        display: flex;
        gap: 4px;
      }
      #search input {
        flex: 1;
        min-width: 0;
        padding: 6px;
        font: inherit;
      }
      #search button {
        padding: 6px 10px;
        font: inherit;
      }
      #results {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
      }
      #results li {
        padding: 6px;
        border-top: 1px solid #eee;
        cursor: pointer;
      }
      #results li:hover {
        background: #f2f2f2;
      }
      #results li.empty {
        cursor: default;
        color: #777;
      }
      #modes {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      #modes button {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px;
        font: inherit;
        background: #f4f4f4;
        border: 2px solid #ccc;
        border-radius: 6px;
        cursor: pointer;
      }
      #modes button[aria-pressed="true"] {
        background: #fff;
        border-color: #222;
        font-weight: 600;
      }
      .swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        flex: none;
        box-sizing: border-box;
      }
      /* Same columns as #modes; 10px = button padding + border, so swatches line up */
      #legend {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      #legend div {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
      }
      #legend .outline {
        border: 1px solid #777;
      }
      #done {
        margin-top: 8px;
        width: 100%;
        padding: 6px;
        font: inherit;
      }
      #hint {
        margin-top: 6px;
        color: #555;
      }
      #error {
        margin-top: 6px;
        color: #b00020;
        font-weight: 600;
      }
      #status {
        bottom: 30px;
        padding: 4px 8px;
      }
      #status.error {
        background: #fde2e2;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="panel" class="box">
      <form id="search">
        <input
          id="query"
          type="search"
          placeholder="Search a place, e.g. San Jose, CA"
        />
        <button type="submit">Search</button>
      </form>
      <ul id="results"></ul>
      <div id="modes" role="group" aria-label="Label to apply">
        <button type="button" data-label="not peat" aria-pressed="true">
          <span class="swatch"></span>Not peat
        </button>
        <button type="button" data-label="peat" aria-pressed="false">
          <span class="swatch"></span>Peat
        </button>
      </div>
      <div id="legend" hidden>
        <div><span class="swatch" data-label="conflict"></span>Disagreement</div>
        <div><span class="swatch outline"></span>Unknown</div>
      </div>
      <button id="done" type="button">I'm done</button>
      <div id="hint"></div>
      <div id="error" hidden></div>
    </div>

    <div id="status" class="box" hidden></div>

    <script src="map.js"></script>
  </body>
</html>
