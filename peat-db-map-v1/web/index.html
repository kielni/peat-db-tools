<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peat-DBase map</title>
    <link
      rel="stylesheet"
      href="https://cdn.maptiler.com/maptiler-sdk-js/v4.2.0/maptiler-sdk.css"
    />
    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.2.0/maptiler-sdk.umd.min.js"></script>
    <script src="https://unpkg.com/flatgeobuf@3.27.2/dist/flatgeobuf-geojson.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #card {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1;
        width: min(340px, calc(100% - 70px));
        max-height: calc(100% - 60px);
        overflow-y: auto;
        padding: 10px 12px;
        background: #fff;
        color: #222;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      #card-close {
        float: right;
        padding: 0 6px;
        font: inherit;
        font-size: 18px;
        line-height: 1;
        background: none;
        border: none;
        cursor: pointer;
      }
      #card h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      #card dl {
        margin: 0;
      }
      #card dt {
        margin-top: 6px;
        color: #555;
        font-size: 12px;
      }
      #card dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="card" hidden>
      <button id="card-close" type="button" aria-label="Close">×</button>
      <h2 id="card-title"></h2>
      <dl id="card-fields"></dl>
    </div>

    <script src="map.js"></script>
  </body>
</html>
