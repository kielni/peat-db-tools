<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peat-DBase map</title>
    <link
      rel="stylesheet"
      href="https://cdn.maptiler.com/maptiler-sdk-js/v4.2.0/maptiler-sdk.css"
    />
    <script src="https://cdn.maptiler.com/maptiler-sdk-js/v4.2.0/maptiler-sdk.umd.min.js"></script>
    <script src="https://unpkg.com/flatgeobuf@3.27.2/dist/flatgeobuf-geojson.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #card {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1;
        width: min(340px, calc(100% - 70px));
        max-height: calc(100% - 60px);
        overflow-y: auto;
        padding: 10px 12px;
        background: #fff;
        color: #222;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      #card-close {
        float: right;
        padding: 0 6px;
        font: inherit;
        font-size: 18px;
        line-height: 1;
        background: none;
        border: none;
        cursor: pointer;
      }
      #card h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      #card dl {
        margin: 0;
      }
      #card-flags {
        margin: 0 0 4px;
        padding: 0;
        list-style: none;
      }
      #card-flags .flag-mark {
        font-weight: bold;
      }
      #card-loading {
        width: 24px;
        height: 24px;
        margin: 12px auto;
        border: 3px solid #ddd;
        border-top-color: #0072b2;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #card-pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 13px;
      }
      #card-pager button {
        font: inherit;
        cursor: pointer;
      }
      #card-pager button:disabled {
        cursor: default;
      }
      #card dt {
        margin-top: 6px;
        color: #555;
        font-size: 12px;
      }
      #card dd {
        margin: 0;
        overflow-wrap: anywhere;
        white-space: pre-line; /* source notes put one citation per line */
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="card" hidden>
      <button id="card-close" type="button" aria-label="Close">×</button>
      <h2 id="card-title"></h2>
      <div id="card-pager" hidden>
        <button id="pager-prev" type="button">‹ Previous</button>
        <span id="pager-label"></span>
        <button id="pager-next" type="button">Next ›</button>
      </div>
      <div id="card-loading" role="status" aria-label="Loading" hidden></div>
      <ul id="card-flags"></ul>
      <dl id="card-fields"></dl>
    </div>

    <script src="map.js"></script>
  </body>
</html>
